events { worker_connections 1024; }
http {
  client_max_body_size 60M;
  upstream api_backend { server api:5000; }
  upstream web_backend { server web:3000; }
  server {
    listen 80;

    # Baseline hardening for every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API rate-limits per client IP for anonymous calls; it trusts X-Forwarded-For only from private networks.
    # $proxy_add_x_forwarded_for appends the real peer address, which the API reads (last hop).
    location /api/ {
      proxy_pass http://api_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { proxy_pass http://web_backend; }
  }
}
