# Serves the built SPA inside the `web` container; the edge nginx (nginx/nginx.conf) proxies "/" here on :3000.
server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (/dashboard, /studio/:id) fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
