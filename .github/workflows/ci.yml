name: CI
on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      # SchemaTests migrate against the compose PostGIS on host port 5433 (docker-compose.override.yml);
      # the API integration tests start their own Testcontainers.
      # Docker Hub now and then refuses a pull ("unauthorized", rate limits) and every integration test fails at
      # container start. Pull the Testcontainers images up front, retrying with a growing wait; Testcontainers
      # only pulls an image that is missing, so the tests then start from these.
      - name: Pull test container images
        run: |
          for image in postgis/postgis:16-3.4-alpine redis:7.2-alpine rabbitmq:3.13-management-alpine \
                       pgsty/minio:RELEASE.2026-08-04T00-00-00Z; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && break
              [ "$attempt" = 5 ] && { echo "::error::could not pull $image"; exit 1; }
              echo "pull of $image failed (attempt $attempt), retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
            done
          done
      - name: Start PostGIS for SchemaTests
        run: cp .env.example .env && docker compose up -d --wait postgres
      - run: dotnet test backend/Plan2Space.sln
        env:
          # The runner is thrown away after the job, so the reaper container (one more Docker Hub pull) is not needed.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  ai-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # opencv-python (pulled in by ultralytics/paddleocr) needs these on a bare runner.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -r ai-service/requirements.txt --no-cache-dir
      - run: cd ai-service && pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd plan2space-web && npm ci && npx vitest run && npm run build

  full-stack-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-service-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke-test-full-stack.sh
